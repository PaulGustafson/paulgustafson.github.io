name: Revise symmetry manuscript

on:
  push:
    branches:
      - agent/revise-symmetry-spine

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revise manuscript sources
        run: python .github/scripts/revise_symmetry.py
      - name: Structural audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ["Emergent_Mathematics_Symmetry.tex","Emergent_Mathematics_Deformation.tex","Emergent_Mathematics_Counting.tex"]:
              text=Path(name).read_text()
              if text.count("\\begin{definition}")!=text.count("\\end{definition}"):
                  raise SystemExit(f"unbalanced definitions in {name}")
              if text.count("\\begin{exercise}")!=text.count("\\end{exercise}"):
                  raise SystemExit(f"unbalanced exercises in {name}")
          symmetry=Path("Emergent_Mathematics_Symmetry.tex").read_text()
          if re.search(r"\\(sub)*section",symmetry.replace("\\section","")):
              raise SystemExit("unexpected intermediate sectioning")
          print("structural audit passed")
          PY
      - name: Build manuscript PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: A_Physical_Introduction_to_Higher_Mathematics.tex
      - name: Commit revised sources and PDF
        shell: bash
        run: |
          rm .github/workflows/revise-symmetry.yml .github/scripts/revise_symmetry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md Emergent_Mathematics_Symmetry.tex Emergent_Mathematics_Counting.tex A_Physical_Introduction_to_Higher_Mathematics.pdf .github/workflows/revise-symmetry.yml .github/scripts/revise_symmetry.py
          git commit -m "Refine symmetry theorem spine"
          git push
